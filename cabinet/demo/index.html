<html lang="ru"><head><base target="_top"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Демо кабинета сети · Sardor Travel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
[hidden]{display:none!important}
:root{
  --bg:#F3F6F5;--surface:#FFFFFF;--ink:#15201F;--muted:#5B6A67;--line:#D9E2DF;--soft:#E9F0EE;
  --accent:#0C6A66;--accent-ink:#FFFFFF;--accent-soft:#DDEFEC;
  --good:#2E7A4B;--good-soft:#E1F1E6;--warn:#9A6414;--warn-soft:#F7ECD8;--plan:#3F5E8C;--plan-soft:#E3EAF5;
  --display:"Unbounded","Onest",system-ui,sans-serif;--body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark;--bg:#0E1514;--surface:#162120;--ink:#E4ECEA;--muted:#93A4A0;--line:#28403C;--soft:#1C2A28;
  --accent:#4DB3A9;--accent-ink:#06201D;--accent-soft:#16332F;
  --good:#6CC08C;--good-soft:#16301F;--warn:#E0A94F;--warn-soft:#33260F;--plan:#8FB0E0;--plan-soft:#1B2638;}}
:root[data-theme="dark"]{
  color-scheme:dark;--bg:#0E1514;--surface:#162120;--ink:#E4ECEA;--muted:#93A4A0;--line:#28403C;--soft:#1C2A28;
  --accent:#4DB3A9;--accent-ink:#06201D;--accent-soft:#16332F;
  --good:#6CC08C;--good-soft:#16301F;--warn:#E0A94F;--warn-soft:#33260F;--plan:#8FB0E0;--plan-soft:#1B2638;}
*{box-sizing:border-box}
html{background:var(--bg);min-height:100%}
body{min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:24px 48px}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
.brand{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--display);font-weight:600;font-size:clamp(24px,4vw,34px);line-height:1.15;margin:6px 0 0;text-wrap:balance}
.meta{color:var(--muted);font-size:13px;text-align:right}
@media (max-width:560px){.meta{text-align:left}}
.meta b{color:var(--ink);font-weight:600}
.daypick{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.daypick button,.daypick input{font:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 10px;min-height:34px}
.daypick button{cursor:pointer}
.today-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:760px){.today-grid{grid-template-columns:1fr}}
.today-grid h3{margin:0 0 8px;font-size:15px;font-weight:700}
#refresh{font:inherit;font-size:12px;color:var(--accent);background:none;border:1px solid var(--line);border-radius:6px;padding:2px 10px;margin-top:6px;cursor:pointer}
#refresh:disabled{color:var(--muted);cursor:default}
h2{font-family:var(--display);font-weight:500;font-size:17px;margin:0;text-wrap:balance}
.sec{display:flex;flex-direction:column;gap:14px}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px}
.hint{color:var(--muted);font-size:13px}
.num{font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi.lead{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.kpi .l{font-size:12px;letter-spacing:.06em;text-transform:uppercase;opacity:.8;font-weight:600}
.kpi .v{font-family:var(--display);font-weight:500;font-size:clamp(20px,3vw,26px);font-variant-numeric:tabular-nums;line-height:1.2;overflow-wrap:anywhere}
.kpi .s{font-size:13px;opacity:.8}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:10px 12px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--soft);position:sticky;top:0}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:last-child td{border-bottom:none}
tfoot td{font-weight:700;border-top:2px solid var(--line);border-bottom:none}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:var(--soft)}
tr.sel td{background:var(--accent-soft)}
td.tour{white-space:normal;min-width:180px;max-width:320px}
/* узкий экран (Telegram на телефоне): тур переносится, отступы меньше, у края таблицы тень «листается вбок», чтобы деньги справа не терялись */
@media (max-width:560px){
  th,td{padding:8px 7px}
  table{font-size:13px}
  td.tour{min-width:96px;max-width:34vw}
  .tbl-wrap{background:linear-gradient(to right,var(--surface) 30%,transparent),linear-gradient(to left,var(--surface) 30%,transparent) 100% 0,linear-gradient(to right,rgba(0,0,0,.18),transparent) 0 0,linear-gradient(to left,rgba(0,0,0,.18),transparent) 100% 0;background-repeat:no-repeat;background-size:36px 100%,36px 100%,14px 100%,14px 100%;background-attachment:local,local,scroll,scroll;background-color:var(--surface)}
}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill.paid{background:var(--good-soft);color:var(--good)}
.pill.due{background:var(--warn-soft);color:var(--warn)}
.pill.plan{background:var(--plan-soft);color:var(--plan)}
.pill.part{background:var(--warn-soft);color:var(--warn)}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,input[type=search]{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
input[type=search]{width:200px;max-width:100%}
select:focus-visible,input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{font:inherit;font-size:13px;border:0;background:transparent;color:var(--muted);padding:8px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.empty{padding:24px;color:var(--muted);text-align:center}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:760px){.two{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:10px}
.panel h3{margin:0;font-size:15px;font-weight:700}
.panel p,.panel ul{margin:0;color:var(--ink)}
.panel ul{padding-left:18px;display:flex;flex-direction:column;gap:6px}
.formula{font-variant-numeric:tabular-nums;background:var(--soft);border-radius:8px;padding:10px 12px;font-size:14px}
a{color:var(--accent)}
.foot{color:var(--muted);font-size:12.5px;border-top:1px solid var(--line);padding-top:14px}
.tag.pre{color:var(--warn);border-color:var(--warn)}
.tag{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-left:6px}

.gate{max-width:520px;margin:12vh auto 0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:12px}
.gate h1{font-size:22px}
.gate code{font-size:18px;font-weight:700;background:var(--soft);padding:6px 10px;border-radius:6px;user-select:all}
.gate button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:10px 14px;background:var(--accent);color:var(--accent-ink);cursor:pointer;align-self:flex-start}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}}
#admin-slot select{margin-bottom:6px}
:root{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#8a5bd6;--s7:#14a8c9;--s8:#d63a4a;--s9:#8aa51c;--s10:#6b7a8f}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#9d78e6;--s7:#2bb8d8;--s8:#e0525f;--s9:#9db832;--s10:#8393a8}}
:root[data-theme="dark"]{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#9d78e6;--s7:#2bb8d8;--s8:#e0525f;--s9:#9db832;--s10:#8393a8}
.ov-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:8px}
.ov-legend i,.ov-tip i,.ov-dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.ov-chart{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.ov-chart svg{display:block;width:100%;height:auto}
.ov-hit{cursor:pointer;outline:none}
.ov-tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;line-height:1.5;padding:8px 10px;border-radius:8px;white-space:nowrap;z-index:3}
.ov-attn{margin:0;padding-left:18px;line-height:1.6}
.lead-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px}
.lead-flow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.lead-flow>div:not(.arr){display:flex;flex-direction:column;min-width:0}
.lead-flow b{font-size:22px;line-height:1.2}
.lead-flow span{font-size:12px;color:var(--muted)}
.lead-flow .arr{color:var(--muted);font-size:20px}
.lead-card p{margin:0}
.pay-sum{margin:0 0 12px}
.mbar{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:8px;overflow-x:auto;padding:8px 0;margin:0 0 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.mbar::-webkit-scrollbar{display:none}
.mbar button{flex:0 0 auto;font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.mbar button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}

.hero{display:flex;flex-direction:column;gap:6px;background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:20px;margin-bottom:12px}
.hero-l{font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;opacity:.85}
.hero-v{font-family:var(--display);font-size:clamp(32px,9vw,44px);font-weight:500;font-variant-numeric:tabular-nums;line-height:1.1}
.hero-s{font-size:13px;opacity:.85}
.hsum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:20px}
.hsum div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.hsum span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.hsum b{font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.hsum b.good{color:var(--good)} .hsum b.warn{color:var(--warn)}
.hc{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:16px;overflow:hidden}
.hc-h{padding:14px 16px 8px}.hc-h h2{margin:0;font-size:17px}.hc-h p{margin:4px 0 0;color:var(--muted);font-size:13px}
.hl{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:10px 16px;border-top:1px solid var(--line)}
.hl-t{min-width:0;display:flex;flex-direction:column;gap:2px;font-size:15px}
.hl-t small{color:var(--muted);font-size:12px;line-height:1.35}
.hl-a{white-space:nowrap;font-variant-numeric:tabular-nums;font-size:15px;text-align:right}
.hl.sum{background:var(--soft)}.hl.sum .hl-t,.hl.sum .hl-a{font-weight:600}
.hl.total{background:var(--accent-soft)}.hl.total .hl-t,.hl.total .hl-a{font-weight:700}
.hl.small .hl-t,.hl.small .hl-a{font-size:14px}.hl.small{padding-left:28px}
.hl.mute .hl-t{color:var(--muted)}
.hd>summary{list-style:none;cursor:pointer}.hd>summary::-webkit-details-marker{display:none}
.hd>summary .hl-t{display:block}.hd>summary .hl-t small{display:block;margin-top:2px}
.hd>summary .hl-t::before{content:'▸ ';color:var(--muted)}.hd[open]>summary .hl-t::before{content:'▾ '}
.hcond{margin:0;padding:6px 16px 14px 34px;font-size:14px;line-height:1.5}
.goal{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.goal h2{margin:0 0 4px;font-size:17px}.goal .gs{margin:0 0 12px;color:var(--muted);font-size:13px;line-height:1.45}
.gbar{height:12px;border-radius:999px;background:var(--soft);overflow:hidden}.gbar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.grow{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-top:6px;color:var(--muted);font-variant-numeric:tabular-nums}
.gbig{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.gbig div{background:var(--soft);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.gbig span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}.gbig b{font-size:15px;font-variant-numeric:tabular-nums}
.grules{margin:12px 0 0;padding:0 0 0 18px;font-size:14px;line-height:1.5}.grules li{margin:3px 0}.grules b{color:var(--accent)}
.hcond li{margin:4px 0}
.hdebt{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:10px;padding:12px 14px;margin:-8px 0 20px}
.hdebt-r{display:flex;justify-content:space-between;align-items:baseline;gap:12px}.hdebt-r span{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.hdebt-r b{font-size:20px;font-variant-numeric:tabular-nums;white-space:nowrap}.hdebt p{margin:6px 0 0;font-size:13px;color:var(--muted);line-height:1.4}

.lc{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.lc-h{padding:18px 18px 4px}.lc-h .k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.lc-h h2{margin:6px 0 2px;font-family:var(--body);font-weight:500;font-size:19px;letter-spacing:-.01em}
.lc-h p{margin:0;color:var(--muted);font-size:12.5px}
.money{margin:16px 18px 6px;padding:16px 18px;border-radius:14px;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 70%,#000));color:var(--accent-ink)}
.money .k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.75}
.money .v{font-family:var(--body);font-weight:300;font-size:36px;letter-spacing:-.02em;line-height:1.15;margin-top:4px;font-variant-numeric:tabular-nums}
.money .s{font-size:12.5px;opacity:.8;margin-top:2px}
.fun{padding:10px 18px 4px;display:flex;flex-direction:column;gap:10px}
.fs{display:grid;grid-template-columns:64px 1fr 108px;align-items:center;gap:10px}
.fs .n{font-family:var(--body);font-weight:300;font-size:22px;font-variant-numeric:tabular-nums}
.fs .t{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}.fs .t i{display:block;height:100%;border-radius:99px;background:var(--accent);opacity:.85}
.fs .l{font-size:12px;color:var(--muted);text-align:right}
.lms{padding:4px 18px 16px}.lm{padding:12px 0;border-top:1px solid var(--line)}
.lm-top{display:flex;justify-content:space-between;align-items:baseline}
.lm-m{font-size:15px}.lm-e{font-family:var(--body);font-weight:400;font-size:16px;font-variant-numeric:tabular-nums}
.lm-bar{height:4px;border-radius:99px;background:var(--soft);margin:8px 0 6px;overflow:hidden}.lm-bar i{display:block;height:100%;background:var(--accent);opacity:.6;border-radius:99px}
.lm-s{font-size:12px;color:var(--muted)}.lc-note{margin:0;padding:0 18px 16px;font-size:12px;color:var(--muted)}
/* ===== Айдентика Sardor Travel (как на sardortravel.com): тёмно-зелёный, лайм, Unbounded + Onest, радиус 18 ===== */
:root{
  --bg:#EEF3EC;--surface:#FFFFFF;--ink:#12201E;--muted:#4B6156;--line:#DDE3DA;--soft:#E4EBE1;
  --accent:#123C3A;--accent-ink:#FFFFFF;--accent-soft:#E7F5C8;--lime:#E2FF8C;--green-d:#0A2827;--r:18px;
  --good:#2E7A4B;--good-soft:#E1F1E6;--plan:#2F5D8A;--plan-soft:#E2EBF4;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A2827;--surface:#123C3A;--ink:#EEF3EC;--muted:#A9BDB4;--line:#24524F;--soft:#174745;
  --accent:#E2FF8C;--accent-ink:#123C3A;--accent-soft:#2A4F3A;}}
:root[data-theme="dark"]{--bg:#0A2827;--surface:#123C3A;--ink:#EEF3EC;--muted:#A9BDB4;--line:#24524F;--soft:#174745;--accent:#E2FF8C;--accent-ink:#123C3A;--accent-soft:#2A4F3A}
body{padding-block:16px 48px}
header.top{background:#123C3A;color:#fff;border-radius:var(--r);padding:20px 22px;align-items:center;box-shadow:0 10px 30px -18px rgba(10,40,39,.6)}
header.top .brand{color:#E2FF8C;padding-top:44px;background:url("https://sardortravel.com/assets/brand/sardor-logo-light.svg") no-repeat 0 0/auto 30px;letter-spacing:.14em}
header.top h1{color:#fff;font-weight:800}
header.top .meta{color:rgba(255,255,255,.72)}
header.top .meta b{color:#E2FF8C}
header.top select,header.top input{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.25)}
header.top select option{color:#12201E}
header.top #refresh{color:#123C3A;background:#E2FF8C;border:0;border-radius:999px;padding:4px 14px;font-weight:700}
header.top #refresh:disabled{opacity:.7;color:#123C3A}
h2{font-weight:600}
.kpi,.tbl-wrap,.panel,.ov-chart,.lead-card,.hsum div,.hc,.gate{border-radius:var(--r)}
.kpi.lead,.hero{background:#123C3A;border-color:#123C3A;color:#fff}
.kpi.lead .v,.hero .hero-v{color:#E2FF8C}
.seg{border-radius:999px}
.seg button[aria-pressed="true"],.mbar button[aria-pressed="true"]{background:#E2FF8C;border-color:#E2FF8C;color:#123C3A;font-weight:700}
.mbar button{border-radius:999px}
button.copy,.btn,button[type=submit]{background:#E2FF8C;color:#123C3A;border:0;border-radius:999px;font-weight:700;font-size:14px;padding:10px 18px;min-height:40px;cursor:pointer}
.links code{font-size:13px;background:var(--soft);border-radius:12px;padding:8px 10px}
a{color:inherit;text-decoration-color:#9BBF3A;text-underline-offset:3px}
.pill.plan{background:#E2FF8C;color:#123C3A}
/* Вкладки, прогресс, значки, калькулятор, QR */
.tab-off{display:none!important}
.tabs{position:sticky;top:0;z-index:6;display:flex;gap:6px;overflow-x:auto;padding:8px 0;background:var(--bg);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;font:inherit;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 16px;border-radius:999px;cursor:pointer}
.tabs button[aria-selected="true"]{background:#123C3A;border-color:#123C3A;color:#E2FF8C}
.bar{height:10px;background:var(--soft);border-radius:999px;overflow:hidden;position:relative}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#9BD04A,#E2FF8C);border-radius:999px}
.prog{display:flex;flex-direction:column;gap:6px}
.prog .t{font-size:14px}

      + L.map(x => '<tr><td class="num">' + dShort(x.d) + '</td><td>' + esc(x.no) + '</td><td class="r">' + fmt(x.amt) + ' ' + esc(x.cur) + '</td><td class="r"><b>' + fmt(x.com) + '</b></td></tr>').join('')

  const PR = D.period, GEN = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
  const pl = (a, b) => b ? (a.slice(5,7) === b.slice(5,7) ? (+a.slice(8)) + '–' + (+b.slice(8)) + ' ' + GEN[+b.slice(5,7)-1] : (+a.slice(8)) + ' ' + GEN[+a.slice(5,7)-1] + ' – ' + (+b.slice(8)) + ' ' + GEN[+b.slice(5,7)-1]) : (+a.slice(8)) + ' ' + GEN[+a.slice(5,7)-1];
  const kp = [

    PR && PR.openFrom ? {l:'Копится до выплаты ' + pl(PR.payDate), v: thb(PR.open), s:'за ' + pl(PR.openFrom, PR.openTo) + ': сумма не входит в «К выплате», пока период не закончится'} : {l:'Остаток прошлого месяца', v: thb(T.prev), s:'начислено минус выплачено на конец прошлого месяца'},
    {l:'Начислено · ' + RU_M[+curK.slice(5)-1], v: thb(cm.accrued), s: cm.plan ? 'ещё ≈ ' + thb(cm.plan) + ' в пути' : 'по прошедшим турам'},

  (function renderLadder(){
    if (!D.ladder) return;
    const L = D.ladder[curK] || (curK < '2026-12' ? {n:0, rate:10, next:0, toNext:0, before:'2026-12'} : {n:0, rate:10, next:12, toNext:81});
    const el = document.getElementById('mladder');
    el.hidden = false;
    el.innerHTML = 'Продано в ' + GEN[+curK.slice(5)-1].replace(/я$/,'е').replace(/а$/,'е') + ': <b>' + L.n + ' ' + plural(L.n,['бронь','брони','броней']) + '</b>, ставка <b>' + L.rate + '%</b>'
      + (L.before ? ', лестница с ' + GEN[+L.before.slice(5)-1] : L.next ? ' · до ' + L.next + '% ещё ' + L.toNext + ' ' + plural(L.toNext,['бронь','брони','броней']) : ' — максимальная')
      + '. Комиссия начисляется с даты продажи; ставка месяца действует на все его продажи.';
    // полоска лестницы 0 → 81 (12%) → 151 (15%) и прогноз на конец месяца по нынешнему темпу
    const d = +D.today.slice(8,10), dim = new Date(+curK.slice(0,4), +curK.slice(5,7), 0).getDate();
    const fc = d ? Math.round(L.n / d * dim) : L.n, top = Math.max(151, L.n, fc);
    const rateOf = n => n >= 151 ? 15 : n >= 81 ? 12 : 10;
    el.innerHTML += '<span style="display:block;margin-top:10px">' + barHtml(L.n, top) + '</span>'
      + '<span style="display:flex;justify-content:space-between;font-size:12px;margin-top:4px"><span>0 · 10%</span><span>81 · 12%</span><span>151 · 15%</span></span>'
      + (d < dim ? '<span style="display:block;margin-top:6px">Прогноз: при таком темпе к концу месяца ≈ <b>' + fc + ' ' + plural(fc,['бронь','брони','броней']) + '</b>' + (L.before ? '' : ' — ставка <b>' + rateOf(fc) + '%</b>') + '.</span>' : '');
  })();
  if (D.hold) {
    document.getElementById('mhold-sec').hidden = false;
    document.getElementById('mhold').innerHTML = '<div class="kpis"><div class="kpi"><span class="l">Долг</span><span class="v">' + thb(D.hold.debt) + '</span><span class="s">выдано ранее</span></div>'
      + '<div class="kpi"><span class="l">Удержано</span><span class="v">' + thb(D.hold.held) + '</span><span class="s">' + Math.round(D.hold.pct*100) + '% ваших начислений</span></div>'
      + '<div class="kpi"><span class="l">Осталось погасить</span><span class="v">' + thb(D.hold.left) + '</span><span class="s">долг минус удержано</span></div>'
      + '<div class="kpi lead"><span class="l">К выплате</span><span class="v">' + thb(Math.max(0,T.due)) + '</span><span class="s">после удержания</span></div></div>';
  }
  let sel = 'all';

  function renderMonths(){
    const t = document.getElementById('mmonths');

    t.innerHTML = '<thead><tr><th>Месяц</th><th class="r">Броней</th><th class="r">Начислено, ฿</th>' + (anyFix ? '<th class="r">Фикс, ฿</th>' : '') + '<th class="r">Выплачено, ฿</th></tr></thead><tbody>'
      + (mk.map(k => { const m = D.months[k]; return '<tr class="clickable" data-k="' + k + '" tabindex="0"><td>' + mLabel(k) + '</td><td class="r">' + m.n + '</td><td class="r"><b>' + fmt(m.accrued) + '</b>' + (m.plan ? '<br><small style="color:var(--plan)">+≈' + fmt(m.plan) + ' в пути</small>' : '') + '</td>' + (anyFix ? '<td class="r">' + (m.fixed ? fmt(m.fixed) : '—') + '</td>' : '') + '<td class="r">' + (m.paid ? fmt(m.paid) : '—') + '</td></tr>'; }).join('') || '<tr><td colspan="5" class="empty">Начислений пока нет</td></tr>') + '</tbody>';
    t.querySelectorAll('tr.clickable').forEach(tr => {
      const go = () => { sel = sel === tr.dataset.k ? 'all' : tr.dataset.k; fm.value = sel; renderBookings(); document.getElementById('mbk-title').scrollIntoView({block:'start'}); };
      tr.addEventListener('click', go); tr.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
    });
  }
  function renderBookings(){
    const list = D.rows.filter(r => (r.sd || r.ed) <= D.today && (sel === 'all' || r.k === sel)).sort((a,b) => b.ed.localeCompare(a.ed));
    document.getElementById('mbk-title').textContent = 'Брони' + (sel === 'all' ? '' : ' · ' + mLabel(sel));
    const sum = list.reduce((s,r) => s + r.com, 0);
    document.getElementById('mbookings').innerHTML = '<thead><tr><th>Дата тура</th><th>Ваучер</th><th class="r">Комиссия, ฿</th><th>Тур</th></tr></thead><tbody>'

  }

      : '<p class="hint">Выплат пока не было.</p>';
  }
  function renderPlan(){
    const L = D.rows.filter(r => (r.sd || r.ed) > D.today).sort((a,b) => a.ed.localeCompare(b.ed));
    document.getElementById('mplan-sec').hidden = !L.length;
    if (!L.length) return;
    document.getElementById('mplan').innerHTML = '<thead><tr><th>Дата тура</th><th>Ваучер</th><th class="r">Ожидаемая комиссия, ฿</th><th>Тур</th></tr></thead><tbody>'
      + L.map(r => '<tr><td class="num">' + dShort(r.ed) + '</td><td>' + esc(r.v) + '</td><td class="r"><b>' + fmt(r.com) + '</b></td><td class="tour">' + esc(r.t) + '</td></tr>').join('')
      + '</tbody><tfoot><tr><td colspan="2">Всего впереди</td><td class="r">' + fmt(L.reduce((s,r) => s + r.com, 0)) + '</td><td></td></tr></tfoot>';
  }
  if (D.head) { renderHead(D); return; }
  renderMonths(); renderBookings(); renderPays(); renderPlan();
}
function renderHead(D){

  const octLiveRow = H.dept.find(a => a.k === '2026-10'), octLive = octLiveRow ? (octLiveRow.od || octLiveRow.fee) : null;

    + '<div><span>' + (left >= 0 ? 'Можно взять' : 'Взято наперёд') + '</span><b class="' + (left >= 0 ? 'good' : 'warn') + '">' + thb(Math.abs(left)) + '</b></div>'
    + '<div><span>Броней отдела</span><b>' + fmt(deptN) + '</b></div>'

  const repaid = P.months.reduce((s,m) => s + m.toDebt, 0);

  html += goalBlock(P, D.today);
  // 1. Этот месяц

  if (cm.bonus) { const B = cm.bonus, nx = B.n < B.plan ? ['плана', B.plan] : B.n < B.bar ? ['планки', B.bar] : B.n < B.top ? ['сверхцели', B.top] : null;

  html += card('1. Этот месяц', 'всё, что Сардор даёт или платит за тебя, вычитается отсюда', b);

      + ln('От партнёров · ' + a.np, thb(a.mp*0.05), {cls:'small', sub:'маржа ' + thb(a.mp) + ' × 5%'})
      + a.by.map(x => ln(esc(x.n) + ' · ' + x.cnt, thb(x.fee), {cls:'small mute', sub:'прямые ' + thb(x.md) + ' · партнёрские ' + thb(x.mp)})).join('')
      + (a.nodate ? '<p class="hint" style="padding:8px 16px">' + a.nodate + ' брон. без даты продажи — по дате тура</p>' : '')
      + '</details>').join(''));

      + ln('Заработал', thb(m.earned), {cls:'small'}) + ln('30% в долг', minus(m.toDebt), {cls:'small'}) + (m.hsum ? ln('Удержания', minus(m.hsum), {cls:'small'}) : '')
      + m.taken.map(t => ln(esc(t.what) + ' · ' + dShort(t.date), minus(t.amount), {cls:'small mute'})).join('') + '</details>').join(''));
  // 4. Долг
  b = '<details class="hd"><summary>' + ln('Долг на черте 16.11', thb(P.debt0)) + '</summary>'
    + ln('Займы: байк, iPhone, PlayStation', plus(S.loans), {cls:'small'})
    + ln('Октябрь: 30% заработка', minus(S.octPart), {cls:'small', sub:'на черте 16.11 заработал ' + thb(S.octEarned) + (octLive != null && Math.abs(Math.round(octLive) - S.octEarned) >= 1 ? ' (по броням сейчас ' + thb(Math.round(octLive)) + ': разница ' + thb(Math.abs(Math.round(octLive) - S.octEarned)) + ' после черты, на долг не влияет)' : '') + ' − квартира ' + thb(S.octHousing) + ' − 30% = можно было ' + thb(S.octEarned - S.octHousing - S.octPart) + ', взял ' + thb(S.octTaken)})

    + ln('Взял 1–15 ноября', plus(S.novTaken), {cls:'small'}) + '</details>';

  b += ln(P.debt > 0 ? 'Остаток долга' : 'Долга нет', thb(Math.max(P.debt,0)), {cls:'total'});
  html += card((past.length ? '4' : '3') + '. Долг', 'гасится сам — 30% с каждого заработка', b);
  html += card('Условия', '', '<ul class="hcond">' + H.cond2.map(c => '<li>' + esc(c) + '</li>').join('') + '</ul>');
  box.innerHTML = html;

function renderOverview(D){
  const RU_M = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
  const RU_S = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
  const fmt = n => (n==null||isNaN(n)) ? '—' : (Math.round(n)||0).toLocaleString('ru-RU').replace(/,/g,' ');
  const thb = n => fmt(n) + '\u00a0฿';
  const mLabel = k => { const [y,m] = k.split('-'); return RU_M[+m-1] + ' ' + y; };

/* Блок «Цель» для Достона и Дуо (решение Сардора 16.11): наперёд не берём, расчёт 1-го и 16-го, цель — закрыть долг и забирать 100%. */
function goalBlock(P, today){
  const RU_G = ['январю','февралю','марту','апрелю','маю','июню','июлю','августу','сентябрю','октябрю','ноябрю','декабрю'];
  const fmt = n => (Math.round(n||0)||0).toLocaleString('ru-RU').replace(/,/g,' '), thb = n => fmt(n) + '\u00a0฿';
  const debt = Math.max(P.debt, 0), paid = Math.max(P.debt0 - debt, 0), pct = P.debt0 > 0 ? Math.min(100, paid / P.debt0 * 100) : 100;
  const cm = P.months[P.months.length-1] || {earned:0};
  const d = +today.slice(8,10), y = +today.slice(0,4), m = +today.slice(5,7), dim = new Date(y, m, 0).getDate();
  const startDay = cm.k === P.earnFrom.slice(0,7) ? +P.earnFrom.slice(8,10) : 1;
  const perMonth = cm.earned > 0 ? cm.earned / Math.max(1, d - startDay + 1) * dim : 0;
  const toDebtMonth = perMonth * (P.hold || 0.3);
  let when = '—';
  if (debt <= 0) when = 'долг закрыт';
  else if (toDebtMonth > 0) { const n = Math.ceil(debt / toDebtMonth); const dt = new Date(y, m - 1 + n, 1); when = 'к ' + RU_G[dt.getMonth()] + (dt.getFullYear() !== y ? ' ' + dt.getFullYear() : ''); }
  const next = (d === 1 || d === 16) ? 'сегодня' : d < 16 ? '16.' + String(m).padStart(2,'0') : '01.' + String(m === 12 ? 1 : m + 1).padStart(2,'0');
  return '<section class="goal" id="goal"><h2>Цель — закрыть долг и забирать все 100%</h2>'
    + '<p class="gs">Чем больше продаёшь, тем быстрее долг уходит. Когда он станет 0, все 100% заработка — твои.</p>'
    + '<div class="gbar" role="img" aria-label="Долг закрыт на ' + Math.round(pct) + '%"><i style="width:' + pct.toFixed(1) + '%"></i></div>'
    + '<div class="grow"><span>закрыто ' + thb(paid) + ' · ' + Math.round(pct) + '%</span><span>осталось ' + thb(debt) + '</span></div>'
    + '<div class="gbig"><div><span>Долг закроется</span><b>' + when + '</b></div><div><span>' + (next === 'сегодня' ? 'Расчёт' : 'Следующий расчёт') + '</span><b>' + next + '</b></div></div>'
    + '<ul class="grules"><li><b>Наперёд не берём.</b> Берёшь только то, что уже заработал.</li>'
    + '<li><b>Расчёт обычно каждые 2 недели — 1-го и 16-го.</b> Нужно раньше — попроси, рассчитаем по уже заработанному.</li>'
    + '<li>30% каждого заработка гасят долг, 70% — твои.</li>'
    + '<li>«Долг закроется» — прогноз по твоему темпу в этом месяце. Больше продаж — раньше.</li></ul></section>';
}

  const fmt = n => (Math.round(n||0)||0).toLocaleString('ru-RU').replace(/,/g,' '), thb = n => fmt(n) + '\u00a0฿';

  let b = ln('Заработал за ' + mName(cm.k), thb(cm.earned), {sub:'по дате продажи' + (cm.k === (P.earnFrom||'').slice(0,7) ? ' (и проданное раньше, если тур с ' + dShort(P.earnFrom) + ')' : '') + '; отменённые не считаются. Это главная цифра, из неё 30% в долг'});

  let d = '<details class="hd"><summary>' + ln('Долг на черте 16.11', thb(P.debt0)) + '</summary>' + ln('Долг на 01.11', thb(P.snap.debtNov1), {cls:'small'}) + ln('Взял 1–15 ноября (без квартиры)', '+' + thb(P.snap.novTaken), {cls:'small'}) + '</details>';

  const addDays = (s, n) => { const [y,m,d] = s.split('-').map(Number); return new Date(Date.UTC(y, m-1, d+n)).toISOString().slice(0,10); };
  function dayStats(date){
    const S = {n:0,com:0,earned:0,plan:0,list:[]}, E = {n:0,com:0,soldToday:0,list:[]};
    rows.forEach(r => {
      if (r.x) return;
      const it = {v:r.v, t:r.t, ed:r.ed, bd:r.bd, com:r.com||0, pre:!!r.pre};
      if (r.bd === date) { S.n++; S.com += it.com; if (r.ed && r.ed <= today) S.earned += it.com; else S.plan += it.com; S.list.push(it); }
      if (r.ed === date) { E.n++; E.com += it.com; if (r.bd === date) E.soldToday++; E.list.push(it); }
    });
    return {S, E};
  }
  function renderToday(){
    const sec = document.getElementById('today-sec');
    sec.hidden = false;
    if (!/^\d{4}-\d{2}-\d{2}$/.test(DAYSEL || '')) DAYSEL = today;
    const day = DAYSEL, isToday = day === today, future = day > today;
    const RU_G = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
    const dLong = s => (+s.slice(8,10)) + ' ' + RU_G[+s.slice(5,7)-1] + (s.slice(0,4) === today.slice(0,4) ? '' : ' ' + s.slice(0,4));
    document.getElementById('today-title').textContent = isToday ? 'Сегодня · ' + dLong(day) : dLong(day);
    const inp = document.getElementById('day-input'); inp.value = day;
    document.getElementById('day-today').disabled = isToday;
    const {S, E} = dayStats(day);
    const leads = (D.leadsDaily || {})[day];
    const conv = (leads && S.n) ? ' · ' + (S.n / leads * 100).toLocaleString('ru-RU',{maximumFractionDigits:1}) + '%' : '';
    const when = isToday ? 'сегодня' : 'в этот день';
    // лиды показываем, только если они внесены (вкладка «Лиды по дням»); иначе — число продаж
    const kp = [
      leads == null ? {l:'Продаж ' + when, v: String(S.n), s: plural(S.n,['ваучер','ваучера','ваучеров']) + ' оформлено ' + when}
                    : {l:'Лиды ' + when, v: fmt(leads), s: 'закрыто продаж: ' + S.n + conv},
      {l:'Продано на', v: thb(S.com), s: 'ваша доля со всех продаж ' + (isToday ? 'за сегодня' : 'этого дня')},
      {cls:'lead', l: future ? 'Будет заработано' : (isToday ? 'Заработано сегодня' : 'Заработано в этот день'), v: thb(E.com), s: E.n + ' ' + plural(E.n,['экскурсия','экскурсии','экскурсий']) + (isToday ? ' сегодня' : future ? ' в этот день' : ' в этот день') + (E.soldToday ? ' · из них продано в этот день: ' + E.soldToday : '')},
      {l:'Получите позже', v: '≈ ' + thb(S.plan), s: 'по продажам ' + (isToday ? 'за сегодня' : 'этого дня') + ', экскурсии ещё впереди'}
    ];
    document.getElementById('today-kpis').innerHTML = kp.map(x => '<div class="kpi ' + (x.cls||'') + '"><span class="l">' + x.l + '</span><span class="v">' + x.v + '</span><span class="s">' + x.s + '</span></div>').join('');
    const row = cells => '<tr>' + cells.join('') + '</tr>';
    document.getElementById('today-sold').innerHTML = '<thead><tr><th>Ваучер</th><th>Экскурсия</th><th>Дата тура</th><th class="r">Ваше, ฿</th><th>Статус</th></tr></thead><tbody>'
      + (S.list.length ? S.list.map(x => row(['<td>' + esc(x.v) + '</td>','<td class="tour">' + esc(x.t) + (x.pre ? '<span class="tag pre">Предварительно</span>' : '') + '</td>','<td class="num">' + dShort(x.ed) + '</td>','<td class="r"><b>' + fmt(x.com) + '</b></td>', (x.ed && x.ed <= today) ? '<td><span class="pill paid">Заработано</span></td>' : '<td><span class="pill plan">Ждёт экскурсии</span></td>'])).join('') : '<tr><td colspan="5" class="empty">' + (isToday ? 'Сегодня продаж не было' : 'В этот день продаж не было') + '</td></tr>')
      + '</tbody>' + (S.list.length ? '<tfoot><tr><td colspan="3">Заработано ' + thb(S.earned) + ' · ждёт ' + thb(S.plan) + '</td><td class="r">' + fmt(S.com) + '</td><td></td></tr></tfoot>' : '');
    document.getElementById('today-tours').innerHTML = '<thead><tr><th>Ваучер</th><th>Экскурсия</th><th>Продано</th><th class="r">Ваше, ฿</th></tr></thead><tbody>'
      + (E.list.length ? E.list.map(x => row(['<td>' + esc(x.v) + '</td>','<td class="tour">' + esc(x.t) + (x.pre ? '<span class="tag pre">Предварительно</span>' : '') + '</td>','<td class="num">' + (x.bd === day ? (isToday ? 'сегодня' : 'в этот день') : dShort(x.bd)) + '</td>','<td class="r"><b>' + fmt(x.com) + '</b></td>'])).join('') : '<tr><td colspan="4" class="empty">' + (isToday ? 'Сегодня экскурсий нет' : 'В этот день экскурсий нет') + '</td></tr>')
      + '</tbody>' + (E.list.length ? '<tfoot><tr><td colspan="3">' + (future ? 'Будет заработано' : isToday ? 'Заработано сегодня' : 'Заработано в этот день') + '</td><td class="r">' + fmt(E.com) + '</td></tr></tfoot>' : '');
  }
  const setDay = s => { DAYSEL = s; renderToday(); };
  document.getElementById('day-prev').addEventListener('click', () => setDay(addDays(DAYSEL || today, -1)));
  document.getElementById('day-next').addEventListener('click', () => setDay(addDays(DAYSEL || today, 1)));
  document.getElementById('day-today').addEventListener('click', () => setDay(today));
  document.getElementById('day-input').addEventListener('change', e => { if (e.target.value) setDay(e.target.value); });
  function renderAll(){renderBar();renderKpis();renderLeads();renderPays();renderMonths();renderBookings();}
  renderToday();
  renderAll();
}

var AUTH = null;
function gate(html){document.body.classList.remove('net-body');var g=document.getElementById('gate');g.innerHTML=html;g.hidden=false;document.getElementById('app').hidden=true;}
function esc2(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function show(res){
  if(!res||!res.ok){
    var r=res&&res.reason;
    if(REG&&(r==='not_registered'||r==='no_auth'||r==='bad_key')) return regForm(res);
    if(r==='not_registered') return gate('<h1>Кабинет ещё не подключён</h1><p>Отправьте Сардору ваш Telegram ID, он подключит доступ:</p><code id="tgid">'+esc2(res.tgId)+'</code><button type="button" id="cp">Скопировать ID</button><p class="hint">После подключения закройте и снова откройте кабинет.</p>'), bindCopy(res.tgId);
    if(r==='no_partner') return gate('<h1>Партнёр не найден</h1><p>Проверьте вкладку «Партнёры» в таблице.</p>');
    if(r==='bad_key') return gate('<h1>Ссылка недействительна</h1><p>Попросите у Сардора новую ссылку на кабинет.</p>');
    if(r==='bad_signature') return gate('<h1>Не удалось подтвердить вход</h1><p>Закройте кабинет и откройте его снова из бота.</p><p class="hint" style="word-break:break-all;font-size:11px">'+esc2(res.debug)+'</p>');
    return gate('<h1>Откройте кабинет из Telegram</h1><p>Кабинет открывается кнопкой в боте Sardor Travel или по личной ссылке.</p>');
  }
  document.getElementById('gate').hidden=true;
  var app=document.getElementById('app');
  var net=!res.overview&&!res.manager&&(res.agent||res.ptype==='network');
  document.body.classList.toggle('net-body',!!net);
  app.innerHTML=document.getElementById(res.overview?'tpl-ov':res.manager?'tpl-mgr':net?'tpl-net':'tpl').innerHTML;
  app.hidden=false;
  if(res.overview) renderOverview(res); else if(res.manager) renderManager(res); else if(net) renderNet(res); else renderCabinet(res);
  if(!net)tabify(app,(res.manager?'m:':'p:')+(res.partner||res.name||''));
  var meta=app.querySelector('.meta');
  if(meta){var rb=document.createElement('button');rb.type='button';rb.id='refresh';rb.textContent='Обновить';rb.addEventListener('click',function(){refresh(false);});meta.appendChild(document.createElement('br'));meta.appendChild(rb);}
  if(res.admin&&(res.partners||res.managers)){
    var s=document.createElement('select');s.id='as-partner';s.setAttribute('aria-label','Партнёр');
    var isM=!!res.manager;
    s.innerHTML='<option value="__overview"'+(res.overview?' selected':'')+'>Обзор отдела</option>'+(res.partners||[]).map(function(p){return '<option'+(!res.overview&&!isM&&p===res.partner?' selected':'')+'>'+esc2(p)+'</option>';}).join('')+(res.managers&&res.managers.length?'<optgroup label="Менеджеры">'+res.managers.map(function(p){return '<option value="m:'+esc2(p)+'"'+(isM&&p===res.name?' selected':'')+'>'+esc2(p)+'</option>';}).join('')+'</optgroup>':'')+(res.agents&&res.agents.length?'<optgroup label="Агенты сети">'+res.agents.map(function(p){return '<option value="a:'+esc2(p)+'"'+(res.agent&&p===res.name?' selected':'')+'>'+esc2(p)+'</option>';}).join('')+'</optgroup>':'');
    s.addEventListener('change',function(){gate('<div class="spin"></div><div>Загружаем '+(s.value==='__overview'?'обзор отдела':esc2(s.value.replace(/^m:/,'')))+'…</div>');load(s.value);});
    var slot=document.getElementById('admin-slot');slot.appendChild(s);slot.appendChild(document.createElement('br'));
  }
}
/* Регистрация агента по ссылке приглашения (?r=код или start_param r_код из Telegram) */
var REG='';
function regForm(res,msg){
  gate('<h1>Регистрация агента</h1><p>Sardor Travel · экскурсии на Пхукете. После регистрации у вас будет свой кабинет: ссылка для клиентов, ваши брони и заработок.</p>'
    +(msg?'<p style="color:var(--warn)">'+esc2(msg)+'</p>':'')
    +'<form id="reg" style="display:grid;gap:10px;text-align:left;max-width:360px;margin:12px auto">'
    +'<label>Имя и фамилия<br><input name="name" required maxlength="50" autocomplete="name" style="width:100%"></label>'
    +'<label>Телефон<br><input name="phone" type="tel" maxlength="30" autocomplete="tel" style="width:100%"></label>'
    +'<label>Ник в Telegram<br><input name="tg" maxlength="40" placeholder="@ник" style="width:100%"></label>'
    +'<p class="hint" style="margin:0">Телефон или Telegram — чтобы с вами могли связаться.</p>'
    +'<button type="submit">Зарегистрироваться</button></form>');
  var f=document.getElementById('reg');
  f.addEventListener('submit',function(e){
    e.preventDefault();
    var b=f.querySelector('button');b.disabled=true;b.textContent='Регистрируем…';
    var el=f.elements,form={name:el['name'].value,phone:el['phone'].value,tg:el['tg'].value};
    google.script.run.withSuccessHandler(function(r){
      if(!r||!r.ok){
        if(r&&r.reason==='bad_invite')return gate('<h1>Ссылка недействительна</h1><p>Попросите у того, кто вас пригласил, новую ссылку.</p>');
        return regForm(res,(r&&r.msg)||'Не получилось, попробуйте ещё раз.');
      }
      if(r.key)AUTH.key=r.key;
      if(r.already)return load(null);
      gate('<h1>Готово, '+esc2(r.name)+'!</h1><p>Сохраните личную ссылку на кабинет — по ней он откроется в любом браузере:</p>'
        +(r.links&&r.links.personal?'<code id="tgid" style="word-break:break-all">'+esc2(r.links.personal)+'</code><button type="button" class="copy" data-copy="'+esc2(r.links.personal)+'">Копировать</button>':'')
        +'<p><button type="button" id="go">Открыть кабинет</button></p>');
      document.getElementById('go').addEventListener('click',function(){REG='';load(null);});
    }).withFailureHandler(function(err){regForm(res,'Ошибка: '+(err&&err.message||err));}).registerAgent(AUTH,REG,form);
  });
}
function bindCopy(id){var b=document.getElementById('cp');if(!b)return;b.addEventListener('click',function(){try{navigator.clipboard.writeText(String(id)).then(function(){b.textContent='Скопировано';},function(){sel();});}catch(e){sel();}});function sel(){var r=document.createRange();r.selectNodeContents(document.getElementById('tgid'));var w=getSelection();w.removeAllRanges();w.addRange(r);}}
function fail(err){gate('<h1>Ошибка загрузки</h1><p>'+esc2(err&&err.message||err)+'</p><button type="button" onclick="location.reload()">Обновить</button>');}
var DAYSEL=null,KEEP=null,CUR=null,LAST='',LASTAT=0,BUSY=false,REFRESH_MS=5*60*1000;
function sig(res){return JSON.stringify(res,function(k,v){return k==='updated'?undefined:v;});}
/* «Обновить» не должно сбрасывать выбранный месяц и прокрутку: запоминаем перед перерисовкой, возвращаем после. */
function snapUI(){
  var a=document.querySelector('#ov-mbar [aria-pressed="true"], #mbar [aria-pressed="true"]'),v=a&&a.dataset?a.dataset.k:'';
  if(!v){var f=document.getElementById('mf-month')||document.getElementById('nf-month');v=f?f.value:'';}
  return {v:v,y:window.scrollY||0};
}
function restoreUI(ui){
  if(!ui)return;
  if(ui.v&&ui.v!=='all'){
    var b=document.querySelector('#ov-mbar button[data-k="'+ui.v+'"], #mbar button[data-k="'+ui.v+'"]');
    if(b)b.click();
    else{var f=document.getElementById('mf-month')||document.getElementById('nf-month');if(f&&Array.prototype.some.call(f.options,function(o){return o.value===ui.v;})){f.value=ui.v;f.dispatchEvent(new Event('change'));}}
  }
  window.scrollTo(0,ui.y);
}
function load(asPartner){CUR=asPartner||null;google.script.run.withSuccessHandler(function(res){LAST=sig(res);LASTAT=Date.now();var ui=KEEP;KEEP=null;show(res);if(ui&&res&&res.ok)restoreUI(ui);}).withFailureHandler(fail).getCabinet(AUTH,CUR);}
/* Перечитать данные. silent=true — тихо, по таймеру: страницу трогаем, только если данные изменились. */
function refresh(silent){
  if(BUSY||!AUTH)return;
  if(silent&&(NET_DIRTY||document.querySelector('#n-modal:not([hidden])')))return;   // не стираем набранные контакты и открытую карточку
  var want=CUR,btn=document.getElementById('refresh');
  BUSY=true;if(btn&&!silent){btn.disabled=true;btn.textContent='Обновляем…';}
  function done(msg){BUSY=false;var b=document.getElementById('refresh');if(b&&!silent){b.disabled=false;b.textContent=msg;setTimeout(function(){var c=document.getElementById('refresh');if(c&&!c.disabled)c.textContent='Обновить';},2500);}}
  google.script.run.withSuccessHandler(function(res){
    LASTAT=Date.now();
    if(want!==CUR)return done('Обновить');          // пока ждали, открыли другой экран
    if(!res||!res.ok){done('Обновить');if(!silent)show(res);return;}
    var s=sig(res);
    if(s===LAST){done('Данные свежие ✓');return;}
    LAST=s;done('Обновить');var ui=snapUI();show(res);restoreUI(ui);
  }).withFailureHandler(function(err){done(silent?'Обновить':'Не вышло, ещё раз');}).getCabinet(AUTH,want);
}
setInterval(function(){if(document.visibilityState==='visible'&&!document.getElementById('app').hidden)refresh(true);},REFRESH_MS);
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&LASTAT&&Date.now()-LASTAT>REFRESH_MS&&!document.getElementById('app').hidden)refresh(true);});
google.script.url.getLocation(function(loc){
  var h=(loc&&loc.hash)||'';if(h.charAt(0)==='#')h=h.slice(1);
  var initData='';
  h.split('&').forEach(function(kv){var i=kv.indexOf('=');if(i>0&&kv.slice(0,i)==='tgWebAppData')initData=decodeURIComponent(kv.slice(i+1));});
  var key=(loc&&loc.parameter&&loc.parameter.k)||'';
  var sp=/(?:^|&)start_param=([^&]*)/.exec(initData);
  REG=String((loc&&loc.parameter&&loc.parameter.r)||(sp&&/^r_/.test(decodeURIComponent(sp[1]))?decodeURIComponent(sp[1]).slice(2):'')||'').toLowerCase().replace(/[^a-z0-9]/g,'');
  AUTH={initData:initData,key:key,rawHash:(loc&&loc.hash)||''};
  load(null);
});
</script>
